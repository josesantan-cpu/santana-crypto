name: grid

on:
  schedule:
    - cron: "*/15 * * * *"     # cada 15 minutos, 24/7 (papel)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: grid
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Corrida del grid (papel)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.run
      - name: Guardar estado
        run: |
          git config user.name "santana-crypto"
          git config user.email "bot@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || git commit -m "grid $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main || true
          git push || true
